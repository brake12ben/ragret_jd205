[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brake12ben-ragret_jd205"
version = "0.1.0"
description = "按结构键把条目聚类，标出RAG 检索工程师·推理链路的追踪埋点上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "brake12ben" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://brake12ben.github.io"
Repository = "https://github.com/brake12ben/ragret_jd205"
Issues = "https://github.com/brake12ben/ragret_jd205/issues"

[project.scripts]
ragret_jd205 = "ragret_jd205:main"

[tool.setuptools]
py-modules = ["ragret_jd205"]
